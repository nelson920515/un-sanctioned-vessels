name: probe-un-access
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try UN endpoints as a normal client
        run: |
          set +e
          for u in \
            "https://main.un.org/securitycouncil/sites/default/files/1718_designated_vessels_list_final.pdf" \
            "https://main.un.org/securitycouncil/en/sanctions/1718/materials/1718-Designated-Vessels-List" \
            "https://press.un.org/en/2026/sc16519.doc.htm" \
            "https://scsanctions.un.org/resources/xml/en/consolidated.xml"; do
            code=$(curl -sS -L -o out.bin -w "%{http_code} %{size_download} %{content_type}" "$u")
            echo "$u -> $code -> $(head -c 5 out.bin | od -c | head -1)"
          done
          curl -sS -L -o un1718.pdf "https://main.un.org/securitycouncil/sites/default/files/1718_designated_vessels_list_final.pdf"
          ls -la un1718.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: un1718.pdf
          if-no-files-found: ignore
